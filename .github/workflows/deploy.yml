# Deploys main to Azure App Service (Web App for Containers):
#   CI -> build the image -> push to Azure Container Registry -> point the Web App at it -> health check.
#
# Sign-in to Azure uses OpenID Connect (no stored password). Set up once, see docs/DEPLOYMENT.md:
#   GitHub secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   GitHub variables: AZURE_WEBAPP_NAME, ACR_NAME, APP_URL
# Until AZURE_WEBAPP_NAME is set, the deploy job is skipped (CI still runs).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for azure/login with OpenID Connect

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Azure
    needs: ci
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/attendance-portal:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.ACR_NAME }}.azurecr.io/attendance-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}

      - name: Wait for the new version to be healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "${{ vars.APP_URL }}/healthz"; then echo; echo "Healthy"; exit 0; fi
            sleep 15
          done
          echo "The app did not become healthy. Check App Service > Log stream." >&2
          exit 1
