# Run the whole portal locally, the same way it runs in Azure:
#   docker compose up --build        -> http://localhost:8000
# Only the database:
#   docker compose up -d mongo       -> MONGODB_URI=mongodb://localhost:27017 in .env
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
