{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in (development)</h1>
  <p class="muted">Development login is on. Type any email to sign in as that user. This page is never available in production.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login/dev" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" required autofocus autocomplete="email"></label>
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
