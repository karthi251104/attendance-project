<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attendance Portal{% endblock %} · Attendance Portal</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Attendance Portal</a>
    {% if user %}
    <nav class="nav">
      {% if user.is_hr %}<a href="/hr">Cycles</a><a href="/hr/upload">Upload</a>{% endif %}
      <span class="who" title="{{ user.email }}">{{ user.name }}</span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link" type="submit">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="{% block main_class %}page{% endblock %}">
    {% for f in flashes or [] %}<div class="alert alert-{{ f.kind }}">{{ f.message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
