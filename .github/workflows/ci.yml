# Checks every push and pull request: backend tests, frontend typecheck/tests/build,
# and the Docker image (built and started against a real MongoDB, then health-checked).
# Pushes to main run this through the Deploy workflow instead, so it does not run twice.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call: # the deploy workflow runs this first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: attendance-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and check it answers
        run: |
          docker run -d --name portal --network host \
            -e MONGODB_URI=mongodb://localhost:27017 -e DEV_LOGIN=true -e HR_ADMIN_EMAILS=hr@example.com \
            attendance-portal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/hr | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/api/session | grep -q csrf_token
      - name: Container logs
        if: always()
        run: docker logs portal || true
